[project]
name = "optireach-erp-backend"
version = "0.1.0"
description = "OptiReach ERP - FastAPI backend (ERPNext business logic re-architected, no Frappe dependency)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "PyJWT>=2.10",
    "bcrypt>=4.2",
    "structlog>=24.4",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "redis>=5.2",
    "aiosmtplib>=3.0",
    "httpx>=0.28",
    # Spreadsheet migration (Module 12): reads .xlsx exports from Tally, Zoho
    # Books and anything else a customer is leaving behind, and writes the
    # canonical OptiERP import template. Pure Python, no native libs.
    "openpyxl>=3.1",
    # PDF engine for document printing (Section 4.5). Needs native libs (Pango/Cairo/
    # gdk-pixbuf) — installed in the Docker image. MANUAL_REVIEW: WeasyPrint (vs. wkhtmltopdf).
    "weasyprint>=63",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    # Pinned, not floored: Ruff 0.16 expanded its default rule set from 59 to
    # 413 rules (astral-sh/ruff#27199) — an unpinned floor here would let a
    # fresh `pip install` silently start enforcing hundreds of rules this
    # codebase was never written against, exactly what broke CI. The
    # explicit `select` below makes that specific risk moot going forward,
    # but the version stays pinned too, so a future Ruff release can't
    # change *other* default behaviour out from under CI without a
    # deliberate version bump.
    "ruff==0.15.22",
]
# Kept as an alias for compatibility; WeasyPrint now ships in the default deps above.
pdf = ["weasyprint>=63"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Explicit, not inherited: this is Ruff's own pre-0.16 default (pyflakes +
# a narrow pycodestyle slice) and the rule set this codebase has actually
# been maintained against. Pinning it here means CI enforces the same
# thing regardless of which Ruff version installs it — see the version
# pin's comment in pyproject.toml's [project.optional-dependencies].dev.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
